<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حلّها - مساعدك الذكي</title>
    
    <!-- عشان نمنع خطأ الأيقونة -->
    <link rel="icon" href="data:,">

    <!-- استدعاء خط كايرو -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- ربط ملف التصميم -->
    <link rel="stylesheet" href="css/style.css?v=10">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <!-- مكتبة تنسيق النصوص -->
    <script src="https://unpkg.com/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-container">
                <!-- الشعار -->
                <svg class="logo-svg" viewBox="0 0 24 24" fill="none" stroke="url(#grad1)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#4facfe;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M9 18h6"></path>
                    <path d="M10 22h4"></path>
                    <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path>
                    <circle cx="12" cy="9" r="2" fill="url(#grad1)"></circle>
                </svg>
                <span class="logo-text">حلّها</span>
            </div>
            
            <button id="menu-drawer-btn" class="new-chat-btn" type="button">☰ المحادثات</button>
            <div id="chats-drawer" class="side-chats-panel" style="display: none;">
                <div class="side-chats-header">
                    <span>المحادثات</span>
                    <button id="close-drawer-btn" type="button" title="إغلاق">×</button>
                </div>
            <button id="new-chat-btn" class="new-chat-btn" type="button">+ محادثة جديدة</button>
            <div id="history-list" class="history-list"></div>
        </div>
            
            <!-- قسم اختيار الأوضاع -->
            <div class="modes-section"> 
                <p class="section-title">اختر شخصية المساعد:</p>
                <div class="modes-grid">
                    <button class="mode-btn active" data-mode="general">
                        <span>🌐</span> مساعد عام
                    </button>
                    <button class="mode-btn" data-mode="career">
                        <span>💼</span> مدرب التوظيف
                    </button>
                    <button class="mode-btn" data-mode="learning">
                        <span>🎓</span> مستشار التعلم
                    </button>
                </div>
            </div>
            
            <div class="user-profile">
                <div id="user-info" style="display: none; text-align: center; margin-bottom: 10px;">
                    <img id="user-photo" src="" alt="Profile" style="width: 45px; height: 45px; border-radius: 50%; margin-bottom: 5px; border: 2px solid #4facfe;">
                    <div id="user-name" style="font-size: 14px; color: #eee; font-weight: 600;"></div>
                </div>
                <button id="login-btn" class="login-btn">تسجيل الدخول بجوجل</button>
                <button id="logout-btn" class="login-btn" style="display: none; background: transparent; border: 1px solid #ff4757; color: #ff4757; margin-top: 5px;">تسجيل الخروج</button>
            </div>
        </aside>

        <main class="chat-area">
            <div id="chat-box">
                <div class="welcome-screen">
                    <h1 class="welcome-title">كيف يمكنني مساعدتك اليوم؟</h1>
                    <div class="msg bot">أهلاً بك! أنا مساعدك الذكي "حلّها". اختر محادثة أو ابدأ محادثة جديدة.</div>
                </div>
            </div>
            
            <div id="typing-indicator">
                <span></span><span></span><span></span>
            </div>

           <div class="input-group">
    <!-- زرار رفع الملفات -->
    <input type="file" id="file-upload" accept=".pdf" style="display: none;">
    <button id="upload-btn" title="ارفع سيرتك الذاتية">🖇️</button>
    
    <button id="mic-btn" title="تسجيل صوتي">🎤</button>
    <input type="text" id="user-input" placeholder="اكتب سؤالك هنا...">
    <button id="btn">إرسال</button>
</div>
        </main>
    </div>

    <!-- ربط ملف الجافاسكريبت (الرابط ده مهم جداً عشان نمنع الكاش) -->
    <script src="js/app.js"></script>
</body>
</html>
